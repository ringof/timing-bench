# ts2phc.conf — steer the i226 PHC from the F9T PPS via SDP EXTTS (Stage 3).
#
# HARDWARE-VALIDATED 2026-07-10 on host `radio` (i226-LM PCIe card,
# enp3s0 / /dev/ptp0). ts2phc locked the PHC to the F9T 1 PPS: servo state s2,
# steady-state offset ~±10 ns, freq ~+10 ppm. See docs/i226-bringup.md step 5.
#
# WARNING: linuxptp's parser does NOT accept inline (#) comments on value lines
# — it takes everything after the key as the value. Keep values BARE; put notes
# on their own full-line # comments (like these). An inline comment gives
# "malformed value for option ... / failed to parse configuration file".
#
# Key settings and why:
#   ts2phc.pulsewidth 100000000  = F9T pulse width (100 ms LEN_LOCK_TP1).
#   ts2phc.extts_polarity both   = igc is BOTH-edges-only; `rising` is rejected
#                                  (PTP_EXTTS_REQUEST2 -> EOPNOTSUPP). ts2phc
#                                  uses pulsewidth to drop the falling edge.
#   ts2phc.pin_index 0 / channel 0 = F9T PPS lands on SDP0 (confirmed, step 4).
#
# Run (source = generic external PPS; sink = the NIC's own PHC):
#   sudo systemctl stop gpsd.socket gpsd.service   # only if gpsd holds the F9T
#   sudo ts2phc -f config/i226/ts2phc.conf -s generic -c enp3s0 -m
# NOTE: -f is the config flag. ts2phc's -c means "add a PHC sink", NOT config.
# Do NOT set ts2phc.master — that makes the NIC a perout generator, not a reader.

[global]
use_syslog 0
first_step_threshold 0.00002
ts2phc.pulsewidth 100000000

[enp3s0]
ts2phc.extts_polarity both
ts2phc.pin_index 0
ts2phc.channel 0
