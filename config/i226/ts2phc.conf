# ts2phc.conf — steer the i226 PHC from the F9T PPS via SDP EXTTS (Stage 3).
#
# HARDWARE-VALIDATED 2026-07-10 on host `radio` (i226-LM PCIe card,
# enp3s0 / /dev/ptp0). ts2phc locked the PHC to the F9T 1 PPS: servo state s2,
# steady-state offset ~±10 ns, freq ~+10 ppm. See docs/i226-bringup.md step 5.
#
# igc gotcha: igc timestamps BOTH edges only and rejects the rising-only
# PTP_EXTTS_REQUEST2 (EOPNOTSUPP). So extts_polarity MUST be `both`, and
# ts2phc.pulsewidth MUST be set (100 ms = the F9T LEN_LOCK_TP1) so ts2phc
# detects and ignores the falling edge. `rising` does NOT work on igc.
#
# Run (source = generic external PPS; sink = the NIC's own PHC):
#   sudo systemctl stop gpsd.socket gpsd.service   # if gpsd holds the F9T
#   sudo ts2phc -f config/i226/ts2phc.conf -s generic -c enp3s0 -m
# NOTE: -f is the config flag. ts2phc's -c means "add a PHC sink", NOT config.

[global]
use_syslog 0
first_step_threshold 0.00002
ts2phc.pulsewidth 100000000    # F9T pulse width (100 ms LEN_LOCK_TP1); IDs the edge to keep

[enp3s0]                       # confirmed interface (PHC /dev/ptp0)
ts2phc.extts_polarity both     # igc is both-edges-only; `rising` -> EOPNOTSUPP
ts2phc.pin_index 0             # F9T PPS lands on SDP0 (confirmed via testptp, step 4)
ts2phc.channel 0               # EXTTS channel 0
