# ts2phc.conf — steer the i226 PHC from the F9T PPS via SDP EXTTS (Stage 3).
#
# SKELETON — NOT hardware-validated. The i226 card / timeSync breakout are not
# yet installed. Every value marked <CONFIRM> is a placeholder to be replaced
# by an observed reading on the bench:
#   - interface name (enp3s0 is a guess; use what the box reports)
#   - ts2phc.channel  (which SDP EXTTS channel the PPS is on)
#   - ts2phc.pin_index (driver SDP pin index; find with `testptp -e`)
# See docs/i226-bringup.md. Do not run as-is before confirming these.

[global]
use_syslog 1
first_step_threshold 0.00002

[enp3s0]                       # <CONFIRM> real interface name
ts2phc.channel 0               # <CONFIRM> SDP EXTTS channel the PPS is on
ts2phc.extts_polarity rising   # F9T TIMEPULSE POL_TP1=1 (rising) per f9t-setup.md
ts2phc.pin_index 0             # <CONFIRM> driver SDP pin index (testptp -e)
