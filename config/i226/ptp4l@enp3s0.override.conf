# Drop-in override for the shipped ptp4l@.service template, instance enp3s0.
# The template runs `ptp4l -f /etc/linuxptp/ptp4l.conf -i enp3s0`; this adds the
# two things it lacks: ordering after ts2phc, and the post-start pmc SET that
# asserts the grandmaster time-properties flags (ptp4l.conf can't set them and
# they reset to 0 on every start — 0 would land a client on TAI, 37 s off).
#
# Install (note the .service.d directory name matches the instance):
#   sudo install -m0644 config/i226/ptp4l.conf /etc/linuxptp/ptp4l.conf
#   sudo install -m0755 config/i226/ptp4l-gm-settings.sh /usr/local/sbin/ptp4l-gm-settings.sh
#   sudo mkdir -p /etc/systemd/system/ptp4l@enp3s0.service.d
#   sudo install -m0644 config/i226/ptp4l@enp3s0.override.conf \
#        /etc/systemd/system/ptp4l@enp3s0.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl enable --now ptp4l@enp3s0.service

[Unit]
After=ts2phc.service
Wants=ts2phc.service

[Service]
ExecStartPost=/usr/local/sbin/ptp4l-gm-settings.sh
