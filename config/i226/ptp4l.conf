# ptp4l.conf — serve the GPS-locked i226 PHC as a PTP grandmaster (Stage 3).
#
# SKELETON — NOT hardware-validated. Values marked <CONFIRM> are placeholders.
# With Path A (ts2phc owns the PHC), ptp4l only READS the PHC — it must not also
# steer it. clockClass/clockAccuracy below advertise a GPS-traceable GM in BMCA;
# confirm they match the actual locked state before trusting them.
# If the target is a media profile (AES67 / SMPTE 2110), the domain/priorities/
# dscp differ — that is a separate decision, not set here. See docs/i226-bringup.md.

[global]
clockClass 6                   # <CONFIRM> 6 = GPS-locked GM (only once truly locked)
clockAccuracy 0x20             # <CONFIRM> 0x20 = within 100 ns
priority1 128
tx_timestamp_timeout 10

[enp3s0]                       # <CONFIRM> real interface name
