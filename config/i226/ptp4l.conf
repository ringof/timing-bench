# ptp4l.conf — serve the GPS-locked i226 PHC as a PTP grandmaster (Step 7).
#
# HARDWARE-VALIDATED (GM side) 2026-07-11 on host `radio`. ptp4l selects
# /dev/ptp0 (the ts2phc-disciplined PHC, on TAI), assumes the grand master role,
# and advertises clockClass 6 / currentUtcOffset 37 / timeSource GPS. ts2phc
# disciplines the PHC; ptp4l only READS and serves it — it does not steer the
# clock (no upstream master), so the two coexist.
#
# BARE VALUES ONLY: like ts2phc.conf, linuxptp's parser takes everything after
# the key as the value — an inline (#) comment on a value line breaks parsing.
#
# Run:
#   sudo ptp4l -f config/i226/ptp4l.conf -i enp3s0 -m
#
# THEN assert the traceability flags — ptp4l.conf CANNOT set these, and they
# default to 0 (which would make a client distrust the UTC offset and land on
# TAI, 37 s off). They come from a runtime management SET and do NOT survive a
# ptp4l restart (re-run after each start; for a service use ExecStartPost):
#   sudo pmc -u -b 0 'SET GRANDMASTER_SETTINGS_NP clockClass 6 clockAccuracy 0x21 \
#     offsetScaledLogVariance 0xffff currentUtcOffset 37 leap61 0 leap59 0 \
#     currentUtcOffsetValid 1 ptpTimescale 1 timeTraceable 1 frequencyTraceable 1 \
#     timeSource 0x20'
# Verify:  sudo pmc -u -b 0 'GET TIME_PROPERTIES_DATA_SET'
#
# clockAccuracy 0x21 (~100 ns) is an honest advertisement; refine once absolute
# accuracy is verified vs an independent reference. A media profile (AES67 /
# SMPTE 2110) would change domain/priorities/dscp — a separate decision.

[global]
clockClass 6
clockAccuracy 0x21
utc_offset 37
timeSource 0x20
priority1 128
tx_timestamp_timeout 50

[enp3s0]
