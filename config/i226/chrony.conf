# chrony.conf fragment — discipline the SYSTEM clock from the F9T (Stage 3).
#
# SKELETON — NOT hardware-validated. These are the two refclock lines to ADD to
# the host's existing /etc/chrony/chrony.conf, not a complete config. They keep
# the OS clock (logs / NMEA) sane and are INDEPENDENT of the PHC path: chrony
# steers the system clock; ts2phc steers the NIC PHC from the same PPS. Do not
# let phc2sys and ts2phc both steer the PHC (see docs/i226-bringup.md).
#
# <CONFIRM> the PPS device node (/dev/pps0 is a guess; depends on how PPS is
# routed — kernel pps-gpio or SDP-derived). SHM 0 assumes gpsd is publishing
# NMEA to shared-memory segment 0.

refclock SHM 0 refid NMEA offset 0.0 precision 1e-3 poll 4 noselect
refclock PPS /dev/pps0 lock NMEA refid PPS prefer
