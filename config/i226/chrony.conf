# chrony GPS drop-in — discipline the SYSTEM clock from the F9T via gpsd (Step 6).
#
# HARDWARE-VALIDATED 2026-07-11 on host `radio`. Install as a drop-in:
#   sudo cp config/i226/chrony.conf /etc/chrony/conf.d/10-gps.conf
#   sudo systemctl restart chrony
# The host's main /etc/chrony/chrony.conf (NTP pools) is left UNTOUCHED — this is
# an additive, isolated file; delete it to disable GPS entirely.
#
# Architecture (Option A — independent + coarse): gpsd reads the F9T and
# publishes in-band GPS time to SHM unit 0; chrony reads it as a refclock,
# preferred over the NTP pools when present. Keeps the OS clock GPS-traceable but
# COARSE (~ms) — the PRECISE timing lives in the PHC (ts2phc, step 5),
# deliberately separate. `prefer` buys traceability/independence, NOT accuracy
# (coarse in-band GPS ~= internet NTP numerically).
#
# offset 0.063 cancels the measured ~+63 ms gpsd in-band latency (calibrated
# against NTP; chrony SUBTRACTS offset from the raw sample, so a +63 ms lead is
# cancelled with a positive value — wrong sign ~doubles it). With it, GPS comes
# in at ~+/-1.5 ms.
#
# Silent fallback: if gpsd/F9T are down the refclock goes unreachable and chrony
# rides the NTP pools. NOTE: with `prefer`, a stale sample is held on holdover a
# LONG time (dispersion grows only ~1 ppm, so ~hours before it hands to NTP
# mid-session); a reboot with gpsd down uses NTP immediately.
#
# Requires gpsd feeding SHM — see config/i226/gpsd.default (gpsd MUST run -n).

refclock SHM 0 refid GPS precision 1e-3 offset 0.063 poll 4 prefer
